name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      LIFEOPS_DB_PATH: data/ci.sqlite3
      LIFEOPS_LLM_MODE: mock
      WEATHER_PROVIDER: mock
      PLACE_PROVIDER: mock
      SEARCH_PROVIDER: mock
      AMAP_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api.py config.py agent services storage tools
      - run: python -m unittest discover -s tests
