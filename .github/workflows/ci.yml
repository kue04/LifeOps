name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile api.py agent/graph.py agent/langgraph_app.py agent/nodes.py storage/db.py
      - run: python -m unittest tests.test_api_imports tests.test_geocoder_weather
